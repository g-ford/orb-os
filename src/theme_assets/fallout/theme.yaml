# Fallout: a wrist-worn terminal. Green phosphor on a black tube, scanlines, a fine grid, tick marks.
# Green only, never amber: tests/test_fallout_theme.py fails on any colour whose red or blue is above its green.
# Only what differs from the firmware's compiled defaults is written here; everything else keeps
# its value. (That is not Elegant's folder: see docs/theme-yaml.md.)
# The artwork is drawn by tools/fallout_art.py and the typeface, Share Tech Mono (SIL OFL, licence in source/), is
# baked from source/ by tools/build_theme.py (the fonts: block at the end). Each face is baked at one size, so the *Size options do not
# move it. Palette:
#   bright 0x1BFF80   pale 0xB6FFD2   mid 0x11B25A   low 0x0B7A3E   dim 0x064021   tube 0x021A0C
slug: fallout
name: Fallout
author: Orb OS
version: 1
default: false

roleDefaults: false        # colours this theme does not state keep the firmware's compiled values

palette:
  bg:        0x021A0C      # tube
  primary:   0x1BFF80      # bright
  secondary: 0x11B25A      # mid
  text:      0xB6FFD2      # pale
  muted:     0x0B7A3E      # low
  dim:       0x064021
  hairline:  0x0B5A2E
  panel:     0x010D06
  highlight: 0x0A3A1E

# Surveillance stays out of the roster: it has no theme surface, so it would be the one unthemed
# screen in the knob menu.
apps:
  clock: true
  flight: true
  weather: true
  surveillance: false
  headlines: true
  ticker: true

# Eleven characters or fewer: the knob menu draws the current app's name large across the middle.
names:
  clock: "TIME"
  flight: "MAP"
  weather: "ENVIRONS"
  surveillance: "SCAN"
  headlines: "RADIO"
  ticker: "CAPS"
  settings: "STAT"

# ---- TIME ---------------------------------------------------------------------------------
clock:
  hands:
    hour:   {show: true, pivotX: 13, pivotY: 132, centerX: 233, centerY: 233}
    minute: {show: true, pivotX: 10, pivotY: 198, centerX: 233, centerY: 233}
    second: {show: true, pivotX: 7,  pivotY: 206, centerX: 233, centerY: 233}   # the seconds sit on top
    order: [0, 1, 2]
  # The "please wind the clock" screen
  windBg: $panel
  windRingTrack: $dim
  windRingFill: $primary
  windTitle: "Clock offline"
  windTitleCol: $primary
  windAsk: "Turn the knob to sync"
  windAskCol: $text
  windTurnsCol: $muted

# ---- MAP (the flight tracker) ---------------------------------------------------------------
radar:
  sweepEnabled: true
  sweepTypeImage: false
  sweepColor: $primary
  sweepLeadColor: $text
  sweepTrailDeg: 46
  sweepOpacity: 70
  sweepLength: 212            # stops inside the bezel baked into radar_plate.png
  sweepSpeed: 40
  blipTypeImage: true         # arrowheads: radar_blip.png, drawn at its own size
  blipImageTint: false        # keep the sprite's own greens rather than one flat colour
  blipRotate: true            # the point leads, so each arrow faces the way its aircraft is heading
  blipPivotX: 13              # the arrow's centre: the image is 26x26 and points up
  blipPivotY: 13
  blipSize: 13                # only sizes the glow round the selected arrow
  blipFixedColorMode: false   # the palette below is for a plain dot, if the image ever fails to load
  blipAltGround: $dim
  blipAltLow: $muted
  blipAltMid: $secondary
  blipAltHigh: $primary
  blipAltCruise: 0x7DFFB0
  blipAltJet: 0xD2FFE4
  blipGlow: 6
  blipGlowColor: $muted
  selColor: $primary
  selDiameter: 34
  selGlow: 10
  selGlowColor: $primary
  offRangeColor: $muted
  centerRadius: 6             # you are here
  centerColor: $primary
  centerInnerRadius: 2
  centerInnerColor: 0xD2FFE4
  mapRoadColor: $hairline
  mapAirportColor: $primary
  rtext:                      # the selected aircraft's three lines, each on a dark pill
    - {color: $primary, bg: $bg, bgOpa: 200, radius: 6}
    - {color: $secondary, bg: $bg, bgOpa: 200, radius: 6}
    - {color: $text, bg: $bg, bgOpa: 200, radius: 6}
  zones:                      # aircraft never cross the bezel: hide everything outside this circle
    - {x: 233, y: 233, r: 214, invert: true}

# ---- ENVIRONS (the weather map) ---------------------------------------------------------------
weather:
  bg: $panel
  sweepEnabled: true
  sweepColor: $primary
  sweepLeadColor: $text
  sweepTrailDeg: 46
  sweepOpacity: 60
  sweepLength: 212
  sweepSpeed: 30
  ringsEnabled: false         # the rings are baked into weather_plate.png
  crosshair: false
  roadColor: $hairline
  coastColor: $primary
  zones:
    - {x: 233, y: 233, r: 214, invert: true}
  credit:
    color: $muted
  wtext:
    - {show: true, x: 233, y: 92,  fmt: "{cond}", color: $primary, align: 1, bg: $bg, bgOpa: 190, radius: 6}
    - {show: true, x: 233, y: 118, fmt: "{temp}  feels {feels}", color: $text, align: 1, bg: $bg, bgOpa: 190, radius: 6}
    - {show: true, x: 233, y: 346, fmt: "{humidity}  ·  {wind}", color: $secondary, align: 1, bg: $bg, bgOpa: 190, radius: 6}

# ---- CAPS (the stock ticker) ------------------------------------------------------------------
ticker:
  bg: $panel
  upColor: 0x9DFFC8           # no red and no amber in a green terminal: up is bright, down is dim
  downColor: 0x0F9F50
  flatColor: $muted
  nameColor: $secondary
  priceColorOn: true
  priceColor: $primary
  stripColor: $secondary        # the scrolling strip runs between the two rings baked into the plate

# ---- STAT (settings) ------------------------------------------------------------------------------
settings:
  selColor: $primary
  itemColor: $muted
  selGlow: 8
  selGlowColor: $primary
  hlColor: $highlight
  hlW: 260
  hlRadius: 8

# ---- Knob menu ---------------------------------------------------------------------------------
menu:
  current: {color: $primary, glow: 8, glowColor: $primary}
  prev: {color: $muted}
  next: {color: $muted}

# ---- Boot splash ---------------------------------------------------------------------------------
splash:
  network: {color: $text}
  theme: {color: $primary}

# ---- RADIO (headlines) -------------------------------------------------------------------------
intel:
  bg: $panel
  title: "RADIO"              # sits between the two rules baked into intel_plate.png
  titleColor: $primary
  textColor: $text
  sourceColor: $secondary
  staleColor: $muted        # stale news goes dim, not red
  selBarColor: $primary
  selBarOpa: 40
  ageColor: $muted

# ---- TYPEFACE -------------------------------------------------------------------------------
# Share Tech Mono, one face per size. Each is baked once from source/ by tools/build_theme.py and
# shared by every slot that names it: ten faces for twenty-two slots.
fonts:
  faces:
    st12: {src: source/ShareTechMono-Regular.ttf, size: 12}
    st16: {src: source/ShareTechMono-Regular.ttf, size: 16}
    st18: {src: source/ShareTechMono-Regular.ttf, size: 18}
    st20: {src: source/ShareTechMono-Regular.ttf, size: 20}
    st22: {src: source/ShareTechMono-Regular.ttf, size: 22}
    st27: {src: source/ShareTechMono-Regular.ttf, size: 27}
    st28: {src: source/ShareTechMono-Regular.ttf, size: 28}
    st32: {src: source/ShareTechMono-Regular.ttf, size: 32}
    st40: {src: source/ShareTechMono-Regular.ttf, size: 40}
    st46: {src: source/ShareTechMono-Regular.ttf, size: 46}
  slots:
    menu_current: st46
    settings: st27
    radar1: st22
    radar2: st16
    radar3: st16
    radar4: st16
    weather1: st22
    weather2: st22
    weather3: st16
    weather4: st16
    intel_title: st32
    intel_text: st22
    intel_source: st12
    intel_age: st12
    intel_brief: st18
    ticker_name: st16
    ticker_price: st40
    ticker_change: st22
    ticker_strip: st16
    wind_title: st28
    wind_ask: st20
    wind_turns: st16
