# The built-in look, written down: the palette an Orb draws when no theme is selected, and a starting point for a
# theme that is only colours.
#
# To start a theme from this file:
#   1. Copy the folder and change `slug:` and `name:` below. The slug `default` is reserved for the built-in look: the
#      builder refuses it, and the Orb ignores a folder of that name.
#   2. Change the four colours at the top of the palette.
#   3. Delete everything from the "delete from here" line down. The firmware then derives those seven roles from your
#      four; left in, they stay the built-in's green whatever four you chose.
#
# This file is not installed on a card. tests/test_default_palette.py keeps its eleven colours equal to
# theme_roles::BUILT_IN in src/theme/core/theme_roles.h.
slug: default
name: Default
author: Orb OS
version: 1
default: true

palette:
  bg:        0x000000
  primary:   0x1DFF86
  secondary: 0x9AFFC8
  text:      0xEAFFF3
  # ---- delete from here to let the firmware derive the other seven from the four above (theme_roles.h) ----------
  # The built-in look states all eleven so that it equals the firmware's tuned constants exactly.
  muted:     0x818C86
  dim:       0x5F7A6C
  hairline:  0x1C2620
  panel:     0x0C160F
  highlight: 0x232A36
  onPrimary: 0x05100A
  alert:     0xE5484D
