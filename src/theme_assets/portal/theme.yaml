# Portal: white test-chamber panels, dark steel, hazard stripes, an orange and a blue portal.
# Only what differs from the firmware's compiled defaults is written here; everything else keeps
# its value. (That is not the default theme's folder: see docs/theme-yaml.md.)
# The artwork is drawn by tools/portal_art.py. Palette:
#   orange 0xFF9A1F   blue 0x1FA2FF   light blue 0x82CEFF   sentry red 0xFF2D2D   steel 0x8794A3
slug: portal
name: Portal
author: Orb OS
version: 1
default: false

# Surveillance stays out of the roster: it has no theme surface, so it would be the one unthemed
# screen in the knob menu.
apps:
  clock: true
  flight: true
  weather: true
  surveillance: false
  headlines: true
  ticker: true

# Eleven characters or fewer: the knob menu draws the current app's name large, and "Calibration"
# is about as wide as it can be before it runs into the portals either side of it.
names:
  clock: "Test Timer"
  flight: "Sentry Eye"
  weather: "Weather Lab"
  surveillance: "Observation"
  headlines: "PA System"
  ticker: "Enrichment"
  settings: "Calibration"

# ---- Test Timer ---------------------------------------------------------------------------
clock:
  hands:
    hour:   {show: true, pivotX: 13, pivotY: 132, centerX: 233, centerY: 233}
    minute: {show: true, pivotX: 10, pivotY: 198, centerX: 233, centerY: 233}
    second: {show: true, pivotX: 7,  pivotY: 206, centerX: 233, centerY: 233}   # the seconds sit on top
    order: [0, 1, 2]
  # The "please wind the clock" screen
  windBg: 0x0B0E11
  windRingTrack: 0x1E2A36
  windRingFill: 0xFF9A1F
  windTitle: "Testing has\nbeen suspended"
  windTitleCol: 0xFFFFFF
  windAsk: "Turn the knob to resume"
  windAskCol: 0x82CEFF
  windTurnsCol: 0x8794A3

# ---- Sentry Eye (the flight tracker) ---------------------------------------------------------
radar:
  sweepEnabled: true
  sweepTypeImage: false
  sweepColor: 0xFF9A1F
  sweepLeadColor: 0xFFD9A0
  sweepTrailDeg: 46
  sweepOpacity: 70
  sweepLength: 212            # stops inside the bezel baked into radar_plate.png
  sweepSpeed: 40
  blipTypeImage: true         # little sentry droids: radar_blip.png, drawn at its own size
  blipImageTint: false        # keep the white shell and red eye rather than one flat colour
  blipRotate: true            # the eye leads, so each droid faces the way its aircraft is heading
  blipPivotX: 13              # the droid's centre: the image is 26x26 and points up
  blipPivotY: 13
  blipSize: 13                # only sizes the glow round the selected droid
  blipFixedColorMode: false   # the palette below is for a plain dot, if the image ever fails to load
  blipAltGround: 0x5A6470
  blipAltLow: 0xFF9A1F
  blipAltMid: 0xFFC46E
  blipAltHigh: 0x82CEFF
  blipAltCruise: 0x1FA2FF
  blipAltJet: 0xFFFFFF
  blipGlow: 6
  blipGlowColor: 0x0B5FA8
  selColor: 0xFF9A1F
  selDiameter: 34
  selGlow: 10
  selGlowColor: 0xFF9A1F
  offRangeColor: 0x1FA2FF
  centerRadius: 6             # the sentry's red dot
  centerColor: 0xFF2D2D
  centerInnerRadius: 2
  centerInnerColor: 0xFFFFFF
  mapRoadColor: 0x24405A
  mapAirportColor: 0xFF9A1F
  rtext:                      # the selected aircraft's three lines, each on a dark pill
    - {color: 0xFFFFFF, bg: 0x0B0E11, bgOpa: 200, radius: 6}
    - {color: 0xFF9A1F, bg: 0x0B0E11, bgOpa: 200, radius: 6}
    - {color: 0x82CEFF, bg: 0x0B0E11, bgOpa: 200, radius: 6}
  zones:                      # aircraft never cross the bezel: hide everything outside this circle
    - {x: 233, y: 233, r: 214, invert: true}

# ---- Weather Lab (the weather map) ---------------------------------------------------------
weather:
  bg: 0x050A10
  sweepEnabled: true
  sweepColor: 0x1FA2FF
  sweepLeadColor: 0xBFE6FF
  sweepTrailDeg: 46
  sweepOpacity: 60
  sweepLength: 212
  sweepSpeed: 30
  ringsEnabled: false         # the rings are baked into weather_plate.png
  crosshair: false
  roadColor: 0x2A4A66
  coastColor: 0xFF9A1F
  zones:
    - {x: 233, y: 233, r: 214, invert: true}
  credit:
    color: 0x6E8FA8
  wtext:
    - {show: true, x: 233, y: 92,  fmt: "{cond}", color: 0xFFFFFF, align: 1, bg: 0x0B0E11, bgOpa: 190, radius: 6}
    - {show: true, x: 233, y: 118, fmt: "{temp}  feels {feels}", color: 0xFF9A1F, align: 1, bg: 0x0B0E11, bgOpa: 190, radius: 6}
    - {show: true, x: 233, y: 346, fmt: "{humidity}  ·  {wind}", color: 0x82CEFF, align: 1, bg: 0x0B0E11, bgOpa: 190, radius: 6}

# ---- Enrichment (the stock ticker) -----------------------------------------------------------
ticker:
  bg: 0x090C0F
  upColor: 0x1FA2FF           # up is blue, down is orange: the portals, not traffic lights
  downColor: 0xFF9A1F
  flatColor: 0x8794A3
  nameColor: 0x82CEFF
  priceColorOn: true
  priceColor: 0xFFFFFF
  stripColor: 0xB8C4D0        # the scrolling strip runs between the two rings baked into the plate

# ---- Calibration (settings) --------------------------------------------------------------------
settings:
  selColor: 0xFF9A1F
  itemColor: 0x8794A3
  selGlow: 8
  selGlowColor: 0xFF9A1F
  hlColor: 0x1B2733
  hlW: 260
  hlRadius: 8

# ---- Knob menu ---------------------------------------------------------------------------------
menu:
  current: {color: 0xFFFFFF, glow: 8, glowColor: 0xFF9A1F}
  prev: {color: 0x7C8895}
  next: {color: 0x7C8895}

# ---- Boot splash ---------------------------------------------------------------------------------
splash:
  network: {color: 0x82CEFF}
  theme: {color: 0xFF9A1F}

# ---- PA System (headlines) ---------------------------------------------------------------------
intel:
  bg: 0x0B0E11
  title: "ANNOUNCEMENT"       # sits between the two rules baked into intel_plate.png
  titleColor: 0xFF9A1F
  textColor: 0xE6EBF0
  sourceColor: 0x82CEFF
  staleColor: 0xFF2D2D
  selBarColor: 0xFF9A1F
  selBarOpa: 40
  ageColor: 0x6E8FA8
