# Portal: white test-chamber panels, dark steel, hazard stripes, an orange and a blue portal.
# Only what differs from the firmware's compiled defaults is written here; everything else keeps
# its value. (That is not Elegant's folder: see docs/theme-yaml.md.)
# The artwork is drawn by tools/portal_art.py. Palette:
#   orange 0xFF9A1F   blue 0x1FA2FF   light blue 0x82CEFF   sentry red 0xFF2D2D   steel 0x8794A3
slug: portal
name: Portal
author: Orb OS
version: 1
default: false

roleDefaults: false        # colours this theme does not state keep the firmware's compiled values

palette:
  bg:        0x0B0E11
  primary:   0xFF9A1F      # the orange portal
  secondary: 0x82CEFF      # the blue portal's light
  text:      0xFFFFFF
  muted:     0x8794A3
  dim:       0x6E8FA8
  alert:     0xFF2D2D

# Surveillance stays out of the roster: it has no theme surface, so it would be the one unthemed
# screen in the knob menu.
apps:
  clock: true
  flight: true
  weather: true
  surveillance: false
  headlines: true
  ticker: true

# Eleven characters or fewer: the knob menu draws the current app's name large, and "Calibration"
# is about as wide as it can be before it runs into the portals either side of it.
names:
  clock: "Test Timer"
  flight: "Sentry Eye"
  weather: "Weather Lab"
  surveillance: "Observation"
  headlines: "PA System"
  ticker: "Enrichment"
  settings: "Calibration"

# ---- Test Timer ---------------------------------------------------------------------------
clock:
  hands:
    hour:   {show: true, pivotX: 13, pivotY: 132, centerX: 233, centerY: 233}
    minute: {show: true, pivotX: 10, pivotY: 198, centerX: 233, centerY: 233}
    second: {show: true, pivotX: 7,  pivotY: 206, centerX: 233, centerY: 233}   # the seconds sit on top
    order: [0, 1, 2]
  # The "please wind the clock" screen
  windBg: $bg
  windRingTrack: 0x1E2A36
  windRingFill: $primary
  windTitle: "Testing has\nbeen suspended"
  windTitleCol: $text
  windAsk: "Turn the knob to resume"
  windAskCol: $secondary
  windTurnsCol: $muted

# ---- Sentry Eye (the flight tracker) ---------------------------------------------------------
radar:
  sweepEnabled: true
  sweepTypeImage: false
  sweepColor: $primary
  sweepLeadColor: 0xFFD9A0
  sweepTrailDeg: 46
  sweepOpacity: 70
  sweepLength: 212            # stops inside the bezel baked into radar_plate.png
  sweepSpeed: 40
  blipTypeImage: true         # little sentry droids: radar_blip.png, drawn at its own size
  blipImageTint: false        # keep the white shell and red eye rather than one flat colour
  blipRotate: true            # the eye leads, so each droid faces the way its aircraft is heading
  blipPivotX: 13              # the droid's centre: the image is 26x26 and points up
  blipPivotY: 13
  blipSize: 13                # only sizes the glow round the selected droid
  blipFixedColorMode: false   # the palette below is for a plain dot, if the image ever fails to load
  blipAltGround: 0x5A6470
  blipAltLow: $primary
  blipAltMid: 0xFFC46E
  blipAltHigh: $secondary
  blipAltCruise: 0x1FA2FF
  blipAltJet: $text
  blipGlow: 6
  blipGlowColor: 0x0B5FA8
  selColor: $primary
  selDiameter: 34
  selGlow: 10
  selGlowColor: $primary
  offRangeColor: 0x1FA2FF
  centerRadius: 6             # the sentry's red dot
  centerColor: $alert
  centerInnerRadius: 2
  centerInnerColor: $text
  mapRoadColor: 0x24405A
  mapAirportColor: $primary
  rtext:                      # the selected aircraft's three lines, each on a dark pill
    - {color: $text, bg: $bg, bgOpa: 200, radius: 6}
    - {color: $primary, bg: $bg, bgOpa: 200, radius: 6}
    - {color: $secondary, bg: $bg, bgOpa: 200, radius: 6}
  zones:                      # aircraft never cross the bezel: hide everything outside this circle
    - {x: 233, y: 233, r: 214, invert: true}

# ---- Weather Lab (the weather map) ---------------------------------------------------------
weather:
  bg: 0x050A10
  sweepEnabled: true
  sweepColor: 0x1FA2FF
  sweepLeadColor: 0xBFE6FF
  sweepTrailDeg: 46
  sweepOpacity: 60
  sweepLength: 212
  sweepSpeed: 30
  ringsEnabled: false         # the rings are baked into weather_plate.png
  crosshair: false
  roadColor: 0x2A4A66
  coastColor: $primary
  zones:
    - {x: 233, y: 233, r: 214, invert: true}
  credit:
    color: $dim
  wtext:
    - {show: true, x: 233, y: 92,  fmt: "{cond}", color: $text, align: 1, bg: $bg, bgOpa: 190, radius: 6}
    - {show: true, x: 233, y: 118, fmt: "{temp}  feels {feels}", color: $primary, align: 1, bg: $bg, bgOpa: 190, radius: 6}
    - {show: true, x: 233, y: 346, fmt: "{humidity}  ·  {wind}", color: $secondary, align: 1, bg: $bg, bgOpa: 190, radius: 6}

# ---- Enrichment (the stock ticker) -----------------------------------------------------------
ticker:
  bg: 0x090C0F
  upColor: 0x1FA2FF           # up is blue, down is orange: the portals, not traffic lights
  downColor: $primary
  flatColor: $muted
  nameColor: $secondary
  priceColorOn: true
  priceColor: $text
  stripColor: 0xB8C4D0        # the scrolling strip runs between the two rings baked into the plate

# ---- Calibration (settings) --------------------------------------------------------------------
settings:
  selColor: $primary
  itemColor: $muted
  selGlow: 8
  selGlowColor: $primary
  hlColor: 0x1B2733
  hlW: 260
  hlRadius: 8

# ---- Knob menu ---------------------------------------------------------------------------------
menu:
  current: {color: $text, glow: 8, glowColor: $primary}
  prev: {color: 0x7C8895}
  next: {color: 0x7C8895}

# ---- Boot splash ---------------------------------------------------------------------------------
splash:
  network: {color: $secondary}
  theme: {color: $primary}

# ---- PA System (headlines) ---------------------------------------------------------------------
intel:
  bg: $bg
  title: "ANNOUNCEMENT"       # sits between the two rules baked into intel_plate.png
  titleColor: $primary
  textColor: 0xE6EBF0
  sourceColor: $secondary
  staleColor: $alert
  selBarColor: $primary
  selBarOpa: 40
  ageColor: $dim

# ---- TYPEFACE -------------------------------------------------------------------------------
# Barlow (SIL OFL, licence in source/): a DIN-style sans, clinical and industrial, legible at 14 to 20 px on
# the AMOLED. Five sizes, not one per slot: each is a separate face in flash and in PSRAM. Every radar text
# line uses the 20.
fonts:
  faces:
    barlow14: {src: source/Barlow-Regular.ttf, size: 14}
    barlow20: {src: source/Barlow-Regular.ttf, size: 20}
    barlow28: {src: source/Barlow-Regular.ttf, size: 28}
    barlow40: {src: source/Barlow-Regular.ttf, size: 40}
    barlow46: {src: source/Barlow-Regular.ttf, size: 46}
  slots:
    menu_current: barlow46
    menu_prev: barlow14
    menu_next: barlow14
    settings: barlow28
    radar1: barlow20
    radar2: barlow20
    radar3: barlow20
    radar4: barlow20
    weather1: barlow20
    weather2: barlow20
    weather3: barlow14
    weather4: barlow14
    intel_title: barlow28
    intel_text: barlow20
    intel_source: barlow14
    intel_age: barlow14
    intel_brief: barlow20
    ticker_name: barlow14
    ticker_price: barlow40
    ticker_change: barlow20
    ticker_strip: barlow14
    wind_title: barlow28
    wind_ask: barlow20
    wind_turns: barlow14
